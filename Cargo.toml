[package]
name = "next-brep-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The next.BREP adapter for the B-rep protocol the conformance suite drives"
publish = false

[dependencies]
brep-protocol = "=1.0.0"
brep_kernel = { package = "BREP_kernel", version = "=0.24.0" }
# The same release's blend crate, for the edge-to-faces order `BREP_kernel` does not re-export.
brep_blend = { package = "BREP_blend", version = "=0.24.0" }
